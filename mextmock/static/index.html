
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>mextmock</title>
    <style>
      :root{--bg:#ffffff;--muted:#0f1724}
      html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--muted)}
      .center{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:28px}
      h1{font-size:64px;margin:0;font-weight:800;letter-spacing:0.02em}
      img.placeholder{max-width:60%;height:auto;border-radius:8px;box-shadow:0 8px 30px rgba(2,6,23,0.08)}
      @media (max-width:700px){h1{font-size:40px}.placeholder{max-width:86%}}
    </style>
  </head>
  <body>
    <main class="center" role="main" aria-labelledby="title">
      <h1 id="title">mextmock</h1>
      <img class="placeholder" src="images/placeholder.png" alt="placeholder image" />
    </main>
  </body>
</html>
